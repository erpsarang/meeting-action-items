<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회의록 할 일 정리</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="page-header">
      <h1 id="app-title"></h1>
      <p id="app-description"></p>
    </header>
    <main>
      <section aria-label="회의록 입력">
        <ui5-card>
          <ui5-card-header slot="header" title-text="회의록 입력"></ui5-card-header>
          <div class="card-content">
            <label for="minutes-input">회의록</label>
            <ui5-textarea id="minutes-input" rows="12" placeholder="회의록을 여기에 붙여 넣으세요" accessible-name="회의록"></ui5-textarea>
          </div>
        </ui5-card>
      </section>
      <section aria-label="할 일">
        <ui5-card>
          <ui5-card-header slot="header" title-text="할 일"></ui5-card-header>
          <div class="card-content">
            <p id="action-items-empty">할 일이 없습니다.</p>
            <ul id="action-items"></ul>
          </div>
        </ui5-card>
      </section>
    </main>
    <script type="module" src="/src/web-main.ts"></script>
  </body>
</html>
