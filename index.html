<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회의록 할 일 정리</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="page-header">
      <h1 id="app-title"></h1>
      <p id="app-description"></p>
    </header>
    <main>
      <section class="card" aria-labelledby="input-title">
        <div class="card-header">
          <h2 id="input-title">회의록 입력</h2>
        </div>
        <label for="minutes-input">회의록</label>
        <textarea id="minutes-input" rows="12" placeholder="회의록을 여기에 붙여 넣으세요"></textarea>
      </section>
      <section class="card" aria-labelledby="result-title">
        <div class="card-header">
          <h2 id="result-title">할 일</h2>
        </div>
        <p id="action-items-empty">할 일이 없습니다.</p>
        <ul id="action-items"></ul>
      </section>
    </main>
    <script type="module" src="/src/web-main.ts"></script>
  </body>
</html>
